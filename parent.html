<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ولي الأمر - AMANAK</title>
<style>body{font-family:Tahoma;background:#f1f3f4;padding:15px;text-align:center}.card{background:white;border-radius:15px;padding:20px;margin:10px auto;max-width:400px}img{border:2px solid #1a73e8;border-radius:10px}h2{color:#1a73e8}</style>
</head>
<body>
<h2>👨‍👩‍👧 لوحة ولي الأمر</h2>
<div class="card">
<h3>🔗 كود العائلة</h3>
<p style="font-size:12px;color:#666">خلي الابن يصور هذا الكود</p>
<img id="qrImg" width="250" height="250">
<h2 id="famCode" style="letter-spacing:3px;margin-top:10px"></h2>
<p style="font-size:11px;color:#888">الكود يشتغل على الكمبيوتر القديم</p>
</div>
<div class="card">
<h3>👶 أبنائي</h3>
<div id="childrenList">لسه مفيش أبناء</div>
</div>
<script>
var BUCKET="AmanakPro2026_Demo_9911";
var familyId=localStorage.getItem('parentFamId');
if(!familyId){familyId="FAM-"+Math.random().toString(36).substr(2,4).toUpperCase()+"-"+Math.floor(1000+Math.random()*9000);localStorage.setItem('parentFamId',familyId)}
document.getElementById('famCode').innerText=familyId;
document.getElementById('qrImg').src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data="+familyId;
var list=JSON.parse(localStorage.getItem('myChildren_'+familyId)||'[]');
if(list.length>0){document.getElementById('childrenList').innerText=list.length+" ابن مربوط";}
setInterval(function(){
fetch("https://kvdb.io/"+BUCKET+"/"+familyId+"_newchild").then(r=>r.text()).then(t=>{
try{var j=JSON.parse(t);if(j&&j.childId){var list=JSON.parse(localStorage.getItem('myChildren_'+familyId)||'[]');var found=false;for(var k=0;k<list.length;k++){if(list[k].childId==j.childId)found=true}
if(!found){list.push({childId:j.childId});localStorage.setItem('myChildren_'+familyId,JSON.stringify(list));document.getElementById('childrenList').innerText="تم ربط: "+j.childId;fetch("https://kvdb.io/"+BUCKET+"/"+familyId+"_newchild",{method:"PUT",body:"{}"});alert("تم ربط ابن جديد: "+j.childId);}}
}catch(e){}
});
},3000);
</script>
</body>
</html>
