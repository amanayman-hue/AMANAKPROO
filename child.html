<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>الابن - AMANAK</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>*{font-family:Cairo,sans-serif;box-sizing:border-box;margin:0;padding:0}body{background:linear-gradient(135deg,#1a73e8,#0d47a1);min-height:100vh;padding:15px;color:white}.card{background:white;color:#202124;border-radius:20px;padding:16px;margin:10px 0}.btn{padding:14px;border-radius:12px;border:0;font-weight:700;width:100%;cursor:pointer}.btn-cam{background:#00c853;color:white}.btn-sos{background:#d93025;color:white;margin-top:10px}#reader{width:100%;border-radius:12px;overflow:hidden;margin-top:10px}</style>
</head>
<body>
<h2>👶 جهاز الابن</h2>
<div class="card">
<div id="notConnected"><h3>🔗 ارتبط مع ولي الأمر</h3><button class="btn btn-cam" onclick="startScan()">📷 تصوير الكود</button><div id="reader"></div></div>
<div id="connected" style="display:none"><p>✅ مربوط</p><div id="familyShow"></div><p id="statusLoc">جاري تحديد الموقع...</p></div>
</div>
<div class="card"><button class="btn btn-sos" onclick="sendSOS()">🚨 SOS</button></div>
<p onclick="localStorage.clear();location.reload()" style="text-align:center;font-size:11px;color:rgba(255,255,255,0.7);margin-top:20px;cursor:pointer">🔄 فك الارتباط</p>
<script>
var BUCKET="AmanakPro2026_Demo_9911";
var familyId=localStorage.getItem('familyId');
var childId=localStorage.getItem('childId');
if(!childId){childId="CHILD-"+Math.random().toString(36).substring(2,6).toUpperCase();localStorage.setItem('childId',childId)}
if(familyId){showConnected()}
function showConnected(){document.getElementById('notConnected').style.display='none';document.getElementById('connected').style.display='block';document.getElementById('familyShow').innerText=familyId+" - "+childId;startLocSharing()}
function startScan(){var html5QrCode=new Html5Qrcode("reader");html5QrCode.start({facingMode:"environment"},{fps:10,qrbox:250},function(decodedText){familyId=decodedText.trim();localStorage.setItem('familyId',familyId);html5QrCode.stop();fetch("https://kvdb.io/"+BUCKET+"/"+familyId+"_newchild",{method:"PUT",body:JSON.stringify({childId:childId,name:"ابني"})}).then(function(){showConnected();alert("تم الربط")})},function(e){}).catch(function(err){alert(err)})}
var lastPos=null;
function startLocSharing(){setInterval(function(){if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(function(pos){lastPos={lat:pos.coords.latitude,lng:pos.coords.longitude,ts:Date.now()};document.getElementById('statusLoc').innerText=lastPos.lat+","+lastPos.lng;fetch("https://kvdb.io/"+BUCKET+"/"+familyId+"_"+childId,{method:"PUT",body:JSON.stringify(lastPos)})})},15000)}
function sendSOS(){if(!lastPos){alert("استنى الموقع");return}var sosData={lat:lastPos.lat,lng:lastPos.lng,ts:Date.now(),sos:true};fetch("https://kvdb.io/"+BUCKET+"/"+familyId+"_"+childId,{method:"PUT",body:JSON.stringify(sosData)}).then(function(){alert("تم ارسال استغاثة")})}
</script>
</body>
</html>
