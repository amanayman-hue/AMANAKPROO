<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMANAK PRO - حماية أطفال بذكاء</title>
<style>
*{font-family:'Cairo',sans-serif;box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(135deg,#1a73e8,#0d47a1);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:15px;color:white}
.card{background:white;color:#202124;border-radius:24px;padding:24px;width:100%;max-width:380px;text-align:center;box-shadow:0 15px 40px rgba(0,0,0,0.3)}
.btn{padding:16px;border-radius:14px;border:0;width:100%;font-weight:800;font-size:18px;cursor:pointer;margin-top:12px;display:block;text-decoration:none}
.btn-parent{background:#1a73e8;color:white}
.btn-child{background:#00c853;color:white}
.small{font-size:11px;color:#888;margin-top:15px;cursor:pointer;text-decoration:underline}
.logo{font-size:32px;font-weight:900;color:#1a73e8}
</style>
</head>
<body>
<div class="card">
<div class="logo">🛡️ AMANAK PRO</div>
<p style="font-size:13px;color:#5f6368;margin:8px 0 18px">حماية أطفالك بذكاء - نظام مراقبة عائلي متكامل</p>

<div id="chooser">
<a class="btn btn-parent" onclick="choose('parent')">👨‍👩‍👧 تطبيق ولي الأمر<br><span style="font-size:11px;font-weight:400">فيه الخريطة والتحكم والـ QR</span></a>
<a class="btn btn-child" onclick="choose('child')">👶 تطبيق الطفل<br><span style="font-size:11px;font-weight:400">فيه حماية وزر SOS</span></a>
<p style="font-size:11px;color:#888;margin-top:12px">اختيارك هيتحفظ للأبد على هذا الجهاز</p>
</div>

<div id="loading" style="display:none">
<p style="font-size:14px;color:#1a73e8">⏳ جاري فتح تطبيقك المحفوظ...</p>
<p id="roleText" style="font-size:12px;color:#666;margin-top:5px"></p>
<a class="small" onclick="reset()">تغيير الاختيار (تحويل الجهاز لطفل / ولي أمر)</a>
</div>
</div>

<script>
// لو الجهاز متسجل قبل كده - افتحه تلقائي
let savedRole = localStorage.getItem('appRole');
if(savedRole){
  document.getElementById('chooser').style.display='none';
  document.getElementById('loading').style.display='block';
  document.getElementById('roleText').innerText = savedRole==='parent' ? 'محفوظ كـ: ولي أمر' : 'محفوظ كـ: طفل';
  setTimeout(()=>{
    if(savedRole==='parent') location.href='parent.html';
    else location.href='child.html';
  },800);
}

function choose(role){
  localStorage.setItem('appRole',role);
  if(role==='parent') location.href='parent.html';
  else location.href='child.html';
}

function reset(){
  localStorage.removeItem('appRole');
  location.reload();
}
</script>
</body>
</html>
